[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time simulation of a destination-dispatch elevator system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib==3.11.2"]
dev = [
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error:::elevator_sim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "PT", "RUF"]

[tool.mypy]
strict = true
